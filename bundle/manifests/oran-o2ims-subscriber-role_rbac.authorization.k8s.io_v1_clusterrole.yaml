apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    role: subscriber-role
  name: oran-o2ims-subscriber-role
rules:
- nonResourceURLs:
  - /O2ims_infrastructureMonitoring/v1/alarmSubscriptions
  - /O2ims_infrastructureInventory/v2/subscriptions
  - /O2ims_infrastructureCluster/v1/subscriptions
  verbs:
  - get
  - create
- nonResourceURLs:
  - /O2ims_infrastructureMonitoring/v1/alarmSubscriptions/*
  - /O2ims_infrastructureInventory/v2/subscriptions/*
  - /O2ims_infrastructureCluster/v1/subscriptions/*
  verbs:
  - get
  - delete
