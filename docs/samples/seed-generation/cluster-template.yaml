# Adapt an existing validated SNO ClusterTemplate and its referenced ConfigMaps
# for your site. This example shows the seed-generation contract only.
apiVersion: clcm.openshift.io/v1alpha1
kind: ClusterTemplate
metadata:
  name: sno-ran-du-seedgen.v4-Y-Z-1
  namespace: sno-ran-du-v4-Y-Z
spec:
  name: sno-ran-du-seedgen
  version: v4-Y-Z-1
  release: 4.Y.Z
  templateDefaults:
    hwMgmtDefaults:
      nodeGroupData:
      - name: master
        role: master
        resourceSelector:
          resourceselector.clcm.openshift.io/server-type: XR8620t
    clusterInstanceDefaults: clusterinstance-defaults-v1
    policyTemplateDefaults: policytemplate-defaults-v1
    upgradeDefaults:
      # The schema below requires the ProvisioningRequest to supply the seed
      # image and registry Secret reference. Replace this empty object with the
      # mapping in the comments to configure a live ISO.
      seedGeneration: {}
      # seedGeneration:
      #   # Optional overall timeout; defaults to 2h for seed-only generation
      #   # and 3h when liveISO is configured.
      #   seedGenerationTimeout: 3h
      #   # Configure the upload Secret and URL before enabling liveISO.
      #   # sshKey is a public key for core SSH access to inspect the
      #   # pre-provisioning host and its logs.
      #   liveISO:
      #     uploadSecretRef:
      #       name: iso-server-credentials
      #     urlBase: https://iso.example.com/ibi/
      #     sshKey: "ssh-ed25519 AAAA... user@example"
  templateParameterSchema:
    type: object
    additionalProperties: false
    required:
    - nodeClusterName
    - oCloudSiteId
    - clusterInstanceParameters
    - policyTemplateParameters
    - upgradeParameters
    properties:
      nodeClusterName:
        type: string
      oCloudSiteId:
        type: string
      clusterInstanceParameters:
        type: object
        properties:
          nodeGroups:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
      policyTemplateParameters:
        type: object
        properties: {}
      upgradeParameters:
        type: object
        additionalProperties: false
        required:
        - seedGeneration
        properties:
          seedGeneration:
            type: object
            additionalProperties: false
            required:
            - seedImage
            - seedAuthSecretRef
            properties:
              seedImage:
                type: string
                minLength: 1
                pattern: '^\S+$'
                not:
                  pattern: '://'
              seedAuthSecretRef:
                type: object
                additionalProperties: false
                required:
                - name
                properties:
                  name:
                    type: string
                    minLength: 1
              seedGenerationTimeout:
                type: string
