apiVersion: clcm.openshift.io/v1alpha1
kind: ClusterTemplate
metadata:
  name: 3node-ran-du.v4-Y-Z+1-1
  namespace: 3node-ran-du-v4-Y-Z+1
spec:
  name: 3node-ran-du
  version: v4-Y-Z+1-1
  release: 4.Y.Z+1
  templateDefaults:
    hwMgmtDefaults:
      hardwareProvisioningTimeout: "120m"
      nodeGroupData:
        - name: master
          role: master
          resourceSelector:
            "resourceselector.clcm.openshift.io/server-type": "XR8620t"
            "resourceselector.clcm.openshift.io/server-colour": "purple"
            "hardwaredata/cpu_arch": "x86_64"
            "hardwaredata/num_threads;>=": "128"
    clusterInstanceDefaults: clusterinstance-defaults-v1
    policyTemplateDefaults: policytemplate-defaults-v1
    upgradeDefaults:
      clusterVersion:
        channel: "stable-4.Y.Z+1"
        desiredUpdate:
          version: "4.Y.Z+1"
  templateParameterSchema:
    properties:
      nodeClusterName:
        type: string
      oCloudSiteId:
        type: string
      hwMgmtParameters:
        description: >
          hwMgmtParameters allows overriding hardware management defaults.
        properties:
          hardwareProvisioningTimeout:
            type: string
          nodeGroupData:
            type: array
            items:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                role:
                  type: string
                  enum:
                    - master
                    - worker
                hwProfile:
                  type: string
                resourcePoolId:
                  type: string
                resourceSelector:
                  type: object
                  additionalProperties:
                    type: string
        type: object
      policyTemplateParameters:
        description: policyTemplateSchema defines the available parameters for cluster configuration
        properties:
          sriov-network-vlan-1:
            type: string
          sriov-network-pfNames-1:
            type: string
          sriov-network-vlan-2:
            type: string
          sriov-network-pfNames-2:
            type: string
          cpu-isolated:
            type: string
          cpu-reserved:
            type: string
          hugepages-default:
            type: string
          hugepages-size:
            type: string
          hugepages-count:
            type: string
          install-plan-approval:
            type: string
        type: object
      clusterInstanceParameters:
        description: clusterInstanceParameters defines the available parameters for cluster installation
        properties:
          additionalNTPSources:
            items:
              type: string
            type: array
          apiVIPs:
            items:
              type: string
            maxItems: 2
            type: array
          baseDomain:
            type: string
          clusterName:
            type: string
          extraAnnotations:
            additionalProperties:
              additionalProperties:
                type: string
              type: object
            type: object
          extraLabels:
            additionalProperties:
              additionalProperties:
                type: string
              type: object
            type: object
          ingressVIPs:
            items:
              type: string
            maxItems: 2
            type: array
          machineNetwork:
            items:
              properties:
                cidr:
                  type: string
              required:
              - cidr
              type: object
            type: array
          nodeGroups:
            description: Node configuration by group.
            items:
              properties:
                name:
                  type: string
                  minLength: 1
                  description: >
                    Node group name. Must match a ClusterTemplate defaults
                    nodeGroups entry and the corresponding hardware node
                    group / MachineConfigPool name.
                extraAnnotations:
                  additionalProperties:
                    additionalProperties:
                      type: string
                    type: object
                  description: Additional node-level annotations applied to every
                    host in this group
                  type: object
                extraLabels:
                  additionalProperties:
                    additionalProperties:
                      type: string
                    type: object
                  description: Additional node-level labels applied to every host
                    in this group
                  type: object
                nodeLabels:
                  additionalProperties:
                    type: string
                  description: NodeLabels allows the specification of custom roles
                    for your nodes in your managed clusters. These are additional
                    roles are not used by any OpenShift Container Platform components,
                    only by the user. When you add a custom role, it can be associated
                    with a custom machine config pool that references a specific
                    configuration for that role. Adding custom labels or roles
                    during installation makes the deployment process more effective
                    and prevents the need for additional reboots after the installation
                    is complete.
                  type: object
                nodeNetwork:
                  description: Group-level network overlay applied to every host
                    in this group.
                  properties:
                    config:
                      description: Opaque nmstate overlay (for example dns-resolver
                        and routes) shared by every host in this group.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                nodes:
                  description: Per-host identity and addressing for this group.
                  minItems: 1
                  items:
                    properties:
                      hostName:
                        description: Hostname is the desired hostname for the host
                        type: string
                      extraAnnotations:
                        additionalProperties:
                          additionalProperties:
                            type: string
                          type: object
                        description: Additional annotations for this host
                        type: object
                      extraLabels:
                        additionalProperties:
                          additionalProperties:
                            type: string
                          type: object
                        description: Additional labels for this host
                        type: object
                      nodeLabels:
                        additionalProperties:
                          type: string
                        description: Custom node labels for this host
                        type: object
                      nodeNetwork:
                        description: Per-host addressing keyed by interface name.
                        properties:
                          interfaces:
                            description: Per-interface addressing. Each name must
                              match a defaults nodeNetwork.interfaces[].name.
                            minItems: 1
                            items:
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                addresses:
                                  description: At least one of ipv4 or ipv6; CIDR
                                    strings, e.g. "192.0.2.10/24" or "fd00:1:1::10/64".
                                  properties:
                                    ipv4:
                                      items:
                                        type: string
                                        minLength: 1
                                      minItems: 1
                                      type: array
                                    ipv6:
                                      items:
                                        type: string
                                        minLength: 1
                                      minItems: 1
                                      type: array
                                  minProperties: 1
                                  type: object
                              required:
                              - name
                              - addresses
                              type: object
                            type: array
                        required:
                        - interfaces
                        type: object
                    required:
                    - hostName
                    - nodeNetwork
                    type: object
                  type: array
              required:
              - name
              - nodes
              type: object
            type: array
          serviceNetwork:
            items:
              properties:
                cidr:
                  type: string
              required:
              - cidr
              type: object
            type: array
          sshPublicKey:
            type: string
        required:
        - clusterName
        - nodeGroups
        type: object
      upgradeParameters:
        description: upgradeParameters defines the available upgrade parameters for the cluster upgrade
        properties:
          clusterUpgradeTimeout:
            description: defines the timeout for the cluster upgrade
            type: string
          intermediateVersion:
            description: defines the intermediate version for the cluster EUS upgrade
            type: string
          clusterVersion:
            type: object
            description: defines the ClusterVersion parameters for the upgrade
            properties:
              channel:
                type: string
              upstream:
                type: string
              desiredUpdate:
                type: object
                properties:
                  version:
                    type: string
                  image:
                    type: string
                  force:
                    type: boolean
                  architecture:
                    type: string
                    enum:
                    - "Multi"
                    - ""
        type: object
    required:
      - nodeClusterName
      - oCloudSiteId
      - policyTemplateParameters
      - clusterInstanceParameters
    type: object
