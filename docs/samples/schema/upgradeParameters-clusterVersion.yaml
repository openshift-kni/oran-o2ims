# Sample upgradeParameters schema for MNO ClusterVersion upgrade.
# Copy under ClusterTemplate spec.templateParameterSchema.properties.
# Must not be combined with imageBasedGroupUpgrade in the same schema.

upgradeParameters:
  description: >
    upgradeParameters allows overriding upgrade defaults defined in
    templateDefaults.upgradeDefaults. Values provided here are deep-merged
    on top of the defaults, with ProvisioningRequest values taking precedence.
  properties:
    clusterUpgradeTimeout:
      description: >
        Timeout for the entire cluster upgrade, including both hops for
        EUS upgrades. Must be a valid duration string (e.g., "6h").
        Defaults to 4h for standard upgrades or 8h for EUS upgrades
        when omitted.
      type: string
    intermediateVersion:
      description: >
        Intermediate OCP version for EUS-to-EUS upgrades. Must be valid
        semver with the same major version and exactly one minor version
        below desiredUpdate.version. Auto-selected from the configured
        channel and upstream when omitted.
      type: string
    clusterVersion:
      type: object
      description: ClusterVersion parameters applied to the spoke cluster.
      properties:
        channel:
          description: >
            Update channel (e.g., "stable-4.22"). Required for minor
            version and EUS upgrades.
          type: string
        upstream:
          description: >
            Optional Cincinnati update graph URL. Defaults to the OpenShift
            public graph when omitted.
          type: string
        desiredUpdate:
          type: object
          properties:
            version:
              description: >
                Target OCP version. Must match the ClusterTemplate's
                spec.release.
              type: string
            image:
              description: Optional payload image pull spec for the upgrade.
              type: string
            force:
              type: boolean
            architecture:
              type: string
              enum:
              - "Multi"
              - ""
    workerPoolUpgrade:
      type: object
      description: >
        Controls the rollout relationship between the control plane and
        worker MachineConfigPools. When omitted, the controller uses
        OpenShiftDefault for non-EUS upgrades and Parallel for EUS upgrades.
      properties:
        strategy:
          type: string
          enum:
          - OpenShiftDefault
          - Serial
          - Parallel
          description: >
            Selects how worker MachineConfigPools are rolled out. When the
            strategy is omitted, OpenShiftDefault is used for non-EUS
            upgrades and Parallel is used for EUS upgrades. The
            OpenShiftDefault strategy is supported only for non-EUS upgrades
            and uses the default OpenShift behavior, allowing the control
            plane and worker MachineConfigPools to upgrade together. The
            Serial strategy upgrades the remaining worker MachineConfigPools
            one at a time in alphabetical order, starting only after the
            control plane and any MachineConfigPools upgrading with it have
            completed their upgrades. The Parallel strategy upgrades all
            remaining worker MachineConfigPools together, starting only after
            the control plane and any MachineConfigPools upgrading with it
            have completed their upgrades.
        poolsWithControlPlane:
          type: array
          uniqueItems: true
          description: >
            Names of worker MachineConfigPools that remain unpaused and
            upgrade alongside the control plane. Supported only for non-EUS
            Serial and Parallel upgrades. When omitted or empty, no worker
            MachineConfigPools upgrade with the control plane.
          items:
            type: string
            minLength: 1
  type: object
