# Sample clusterInstanceParameters schema using nodeGroups (recommended).
# Copy under ClusterTemplate spec.templateParameterSchema.properties.
# Defaults ConfigMap must also use nodeGroups (no per-host nodes in defaults).

clusterInstanceParameters:
  description: clusterInstanceParameters defines the available parameters for cluster
    installation
  properties:
    additionalNTPSources:
      description: AdditionalNTPSources is a list of NTP sources (hostname or IP)
        to be added to all cluster hosts. They are added to any NTP sources that were
        configured through other means.
      items:
        type: string
      type: array
    apiVIPs:
      description: APIVIPs are the virtual IPs used to reach the OpenShift cluster's
        API. Enter one IP address for single-stack clusters, or up to two for dual-stack
        clusters (at most one IP address per IP stack used). The order of stacks should
        be the same as order of subnets in Cluster Networks, Service Networks, and
        Machine Networks.
      items:
        type: string
      maxItems: 2
      type: array
    baseDomain:
      description: BaseDomain is the base domain to use for the deployed cluster.
      type: string
    clusterName:
      description: ClusterName is the name of the cluster.
      type: string
    extraAnnotations:
      additionalProperties:
        additionalProperties:
          type: string
        type: object
      description: Additional cluster-wide annotations to be applied to the rendered
        templates
      type: object
    extraLabels:
      additionalProperties:
        additionalProperties:
          type: string
        type: object
      description: Additional cluster-wide labels to be applied to the rendered templates
      type: object
    ingressVIPs:
      description: IngressVIPs are the virtual IPs used for cluster ingress traffic.
        Enter one IP address for single-stack clusters, or up to two for dual-stack
        clusters (at most one IP address per IP stack used). The order of stacks should
        be the same as order of subnets in Cluster Networks, Service Networks, and
        Machine Networks.
      items:
        type: string
      maxItems: 2
      type: array
    machineNetwork:
      description: MachineNetwork is the list of IP address pools for machines.
      items:
        description: MachineNetworkEntry is a single IP address block for node IP
          blocks.
        properties:
          cidr:
            description: CIDR is the IP block address pool for machines within the
              cluster.
            type: string
        required:
        - cidr
        type: object
      type: array
    nodeGroups:
      description: Node configuration by group.
      items:
        properties:
          name:
            type: string
            minLength: 1
            description: >
              Node group name. Must match a ClusterTemplate defaults
              nodeGroups entry and the corresponding hardware node
              group / MachineConfigPool name.
          extraAnnotations:
            additionalProperties:
              additionalProperties:
                type: string
              type: object
            description: Additional node-level annotations applied to every host in
              this group
            type: object
          extraLabels:
            additionalProperties:
              additionalProperties:
                type: string
              type: object
            description: Additional node-level labels applied to every host in this
              group
            type: object
          nodeLabels:
            additionalProperties:
              type: string
            description: NodeLabels allows the specification of custom roles for your
              nodes in your managed clusters. These are additional roles are not used
              by any OpenShift Container Platform components, only by the user. When
              you add a custom role, it can be associated with a custom machine config
              pool that references a specific configuration for that role. Adding
              custom labels or roles during installation makes the deployment process
              more effective and prevents the need for additional reboots after the
              installation is complete.
            type: object
          nodeNetwork:
            description: Group-level network overlay applied to every host in this
              group.
            properties:
              config:
                description: Opaque nmstate overlay (for example dns-resolver and
                  routes) shared by every host in this group.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            type: object
          nodes:
            description: Per-host identity and addressing for this group.
            items:
              properties:
                hostName:
                  description: Hostname is the desired hostname for the host
                  type: string
                extraAnnotations:
                  additionalProperties:
                    additionalProperties:
                      type: string
                    type: object
                  description: Additional annotations for this host
                  type: object
                extraLabels:
                  additionalProperties:
                    additionalProperties:
                      type: string
                    type: object
                  description: Additional labels for this host
                  type: object
                nodeLabels:
                  additionalProperties:
                    type: string
                  description: Custom node labels for this host
                  type: object
                nodeNetwork:
                  description: Per-host addressing keyed by interface name.
                  properties:
                    interfaces:
                      description: Per-interface addressing. Each name must match
                        a defaults nodeNetwork.interfaces[].name.
                      minItems: 1
                      items:
                        properties:
                          name:
                            type: string
                            minLength: 1
                          addresses:
                            description: At least one of ipv4 or ipv6; CIDR strings,
                              e.g. "192.0.2.10/24" or "fd00:1:1::10/64".
                            properties:
                              ipv4:
                                items:
                                  type: string
                                  minLength: 1
                                minItems: 1
                                type: array
                              ipv6:
                                items:
                                  type: string
                                  minLength: 1
                                minItems: 1
                                type: array
                            minProperties: 1
                            type: object
                        required:
                        - name
                        - addresses
                        type: object
                      type: array
                  required:
                  - interfaces
                  type: object
              required:
              - hostName
              - nodeNetwork
              type: object
            type: array
        required:
        - name
        - nodes
        type: object
      type: array
    serviceNetwork:
      description: ServiceNetwork is the list of IP address pools for services.
      items:
        description: ServiceNetworkEntry is a single IP address block for node IP
          blocks.
        properties:
          cidr:
            description: CIDR is the IP block address pool for machines within the
              cluster.
            type: string
        required:
        - cidr
        type: object
      type: array
    sshPublicKey:
      description: SSHPublicKey is the public Secure Shell (SSH) key to provide access
        to instances. This key will be added to the host to allow ssh access
      type: string
  required:
  - clusterName
  - nodeGroups
  type: object
