apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alarms-server
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
# Least-privilege for the events-cleanup CronJob managed via k8s.CreateOrUpdate
# (Get + Create-or-Update). Verbs are limited to the ones that call path
# exercises; list/watch/delete/patch are intentionally omitted. Cross-SA
# workload creation is further constrained by the alarms-server
# ValidatingAdmissionPolicy (see validatingadmissionpolicy_alarms_server.yaml).
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - create
  - update
