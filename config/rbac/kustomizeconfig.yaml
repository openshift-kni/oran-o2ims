# This configuration teaches kustomize to apply namePrefix to
# ServiceAccount references in ClusterRole resourceNames fields.
nameReference:
- kind: ServiceAccount
  version: v1
  fieldSpecs:
  - kind: ClusterRole
    group: rbac.authorization.k8s.io
    path: rules/resourceNames
# Keep the ValidatingAdmissionPolicyBinding's policyName in sync with the
# namePrefix applied to the ValidatingAdmissionPolicy it references.
- kind: ValidatingAdmissionPolicy
  group: admissionregistration.k8s.io
  version: v1
  fieldSpecs:
  - kind: ValidatingAdmissionPolicyBinding
    group: admissionregistration.k8s.io
    path: spec/policyName
