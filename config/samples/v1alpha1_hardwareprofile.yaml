apiVersion: clcm.openshift.io/v1alpha1
kind: HardwareProfile
metadata:
  name: hardwareprofile-sample
  namespace: oran-o2ims
spec:
  bios:
    attributes:
      SriovGlobalEnable: Enabled
      SysProfile: Custom
      WorkloadProfile: TelcoOptimizedProfile
  # Recommended approach: reference FirmwareCatalog entries by name. Each entry
  # is auto-classified by its catalog component type (bios, bmc, or nic).
  # Mutually exclusive with the deprecated biosFirmware/bmcFirmware/nicFirmware
  # inline fields.
  firmwareImages:
    - dell-xr8620t-bios-2.7.5
    - dell-xr8620t-bmc-7.20.70.50
    - dell-xr8620t-nic-mlx-22.36.1010
    - dell-xr8620t-nic-intel-22.5.7
status:
  conditions: []
