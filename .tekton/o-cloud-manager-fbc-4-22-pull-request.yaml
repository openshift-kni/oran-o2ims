apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift-kni/oran-o2ims?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" &&
      target_branch == "release-5.0" &&
      !event_title.contains("[BRANCH-CUT]") &&
      event_title.contains("[NEW-4-22-BUNDLE]") &&
      (
        '.konflux/catalog/4.22/***'.pathChanged()
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: o-cloud-manager-fbc-5-0
    appstudio.openshift.io/component: o-cloud-manager-fbc-5-0
    pipelines.appstudio.openshift.io/type: build
  name: o-cloud-manager-fbc-4-22-on-pull-request
  namespace: telco-5g-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/telco-5g-tenant/o-cloud-manager-fbc-5-0:on-pr-{{revision}}
    - name: image-expires-after
      value: 5d
    - name: build-platforms
      value:
        - linux/x86_64
    - name: dockerfile
      value: .konflux/Dockerfile.catalog.4.22
    - name: catalog-template-file
      value: .konflux/catalog/4.22/catalog-template.in.yaml
    - name: catalog-output-path
      value: .konflux/catalog/4.22/o-cloud-manager/catalog.json
    - name: catalog-idms-path
      value: .konflux/catalog/4.22/catalog-idms.yaml
    - name: catalog-update-script
      value: "true"
    - name: catalog-path
      value: .konflux/catalog/4.22
    - name: hermetic
      value: "true"
    - name: additional-tags
      value: []
  pipelineRef:
    name: fbc-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-o-cloud-manager-fbc-5-0
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
